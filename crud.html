<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 캐릭터창</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: rgb(181, 222, 235);
            padding: 20px 20px;
        }

        h1{
            margin-bottom: 20px;
        }

        label{
            display: inline-block;
            width: 70px;
        }

        form{
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #a6cef5;
        }

        input,
        select{
            margin: 5px;
            padding: 7px;
            border: 1px solid black;
            border-radius: 5px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color : lightblue; 
            background-color: rgb(236, 234, 234);
        }

        button{
            padding: 7px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: rgb(65, 65, 240);
            color: white;
        }

        button:hover{
            background-color: #2f5fa7;
        }

        table{
           text-align: center;
        }

        th{
            padding: 10px;
            background-color: #faf4bb;
            border: 1px solid black;
        }

        td{
            padding: 10px;
            border: 1px solid black;
        }

        tbody tr:hover{
            background-color: rgb(148, 215, 238);
        }

        th:last-child{
            background-color: rgb(181, 222, 235);;
            border:none;
        }

        .button-cell{
            border:none;
        }

        td>button:first-child{
            background-color: #38bd7f;
        }
        td>button:first-child:hover{
            background-color: #259963;
        }
        td>button:last-child{
            background-color: rgb(223, 119, 119);
        }
        td>button:last-child:hover{
            background-color: rgb(192, 89, 89);
        }

    </style>
</head>

<body>
    <h1>RPG 게임 캐릭터 관리</h1>

    <form id="characterInfo">
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" required><br>
        <label for="uClass">클래스</label>
        <select id="uClass">
            <option value="">선택</option>
            <option value="전사">전사</option>
            <option value="궁수">궁수</option>
            <option value="마법사">마법사</option>
            <option value="도적">도적</option>
            <option value="성기사">성기사</option>
        </select><br>
        <label for="level">레벨</label>
        <input type="number" id="level"><br>
        <label for="atk">공격력</label>
        <input type="number" id="atk"><br>
        <label for="def">수비력</label>
        <input type="number" id="def"><br>
        <label for="spd">스피드</label>
        <input type="number" id="spd"><br>

        <button type="submit">생성</button>
    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>닉네임</th>
                <th>클래스</th>
                <th>레벨</th>
                <th>공격력</th>
                <th>수비력</th>
                <th>스피드</th>
                <th></th>
            </tr>
        </thead>

        <tbody id="characterList">

        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<script>
    let index = 3;
    let editIndex = -1; //수정용 변수

    //초기 데이터
    let characters = [
        {
            num: 1,
            nickname: "아르테미스",
            class: "궁수",
            level: 100,
            attack: 85,
            defense: 20,
            speed: 150
        },
        {
            num: 2,
            nickname: "카이저",
            class: "전사",
            level: 83,
            attack: 70,
            defense: 80,
            speed: 30
        },
        {
            num: 3,
            nickname: "스펠위버",
            class: "마법사",
            level: 140,
            attack: 120,
            defense: 20,
            speed: 60
        },
    ]

    //수정
    function editCharacter(num){
        const character = characters.find(function(character){
            return character.num === num;
        })

        editIndex = num-1;
        document.getElementById("nickname").value = character.nickname;
        document.getElementById("uClass").value = character.class;
        document.getElementById("level").value = character.level;
        document.getElementById("atk").value = character.attack;
        document.getElementById("def").value = character.defense;
        document.getElementById("spd").value = character.speed;
    }

    //삭제
    function deleteCharacter(num){
        const character = characters.find(function(character){
            return character.num === num;
        })

        if(confirm("정말 삭제하시겠습니까?")){
            const index = characters.indexOf(character);
            characters.splice(index, 1);
            renderCharacters();
        }
    }

    //화면 갱신 함수
    function renderCharacters() {
        const characterList = document.querySelector("#characterList");

        characterList.innerHTML = "";

        characters.forEach(function (character) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${character.num}</td>
                <td>${character.nickname}</td>
                <td>${character.class}</td>
                <td>${character.level}</td>
                <td>${character.attack}</td>
                <td>${character.defense}</td>
                <td>${character.speed}</td>
                <td class="button-cell">
                    <button onclick="editCharacter(${character.num})">수정</button>
                    <button onclick="deleteCharacter(${character.num})">삭제</button>
                </td>
            `;

            characterList.appendChild(row);
        })
    }

    //validation 함수
    function validate(character) {
        if (character.nickname.length < 2 || character.nickname.length > 10) {
            alert("닉네임은 2~10글자 사이로 입력해주세요.");
            nickname.focus();
            return false;
        }

        if (character.class === "") {
            alert("클래스를 선택하세요.");
            uClass.focus();
            return false;
        }

        if (character.level < 1 || character.level > 200) {
            alert("레벨은 1~200 사이로 입력해주세요.");
            level.focus();
            return false;
        }

        if (character.attack <= 0) {
            alert("공격력은 1 이상이어야 합니다.");
            atk.focus();
            return false;
        }

        if (character.defense <= 0) {
            alert("수비력은 1 이상이어야 합니다.");
            def.focus();
            return false;
        }

        if (character.speed <= 0) {
            alert("스피드는 1 이상이어야 합니다.");
            spd.focus();
            return false;
        }

        return true;
    }

    //생성 버튼 클릭 시 
    document.getElementById("characterInfo").addEventListener("submit", function (event) {
        event.preventDefault();

        const nickname = document.getElementById("nickname").value;
        const uClass = document.getElementById("uClass").value;
        const level = Number(document.getElementById("level").value);
        const atk = Number(document.getElementById("atk").value);
        const def = Number(document.getElementById("def").value);
        const spd = Number(document.getElementById("spd").value);

        //캐릭터 객체 생성
        const character = {
            nickname: nickname,
            class: uClass,
            level: level,
            attack: atk,
            defense: def,
            speed: spd
        };

        //validate 통과 시 생성 
        if(validate(character)){
            if(editIndex === -1){ //새 캐릭터 생성
                character.num = ++index;
                characters.push(character);
            }else{ //기존 캐릭터 수정
                character.num = characters[editIndex].num;
                characters[editIndex] = character;
                editIndex = -1;
            }
            renderCharacters();
            document.querySelector("#characterInfo").reset();
        }
    })

    //초기 화면 생성
    renderCharacters();
</script>
