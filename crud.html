<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 캐릭터창</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <h1>RPG 게임 캐릭터 관리</h1>

    <form id="characterInfo">
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" required><br>
        <label for="uClass">클래스</label>
        <select id="uClass">
            <option value="">선택</option>
            <option value="전사">전사</option>
            <option value="궁수">궁수</option>
            <option value="마법사">마법사</option>
            <option value="도적">도적</option>
            <option value="성기사">성기사</option>
        </select><br>
        <label for="level">레벨</label>
        <input type="number" id="level" required><br>
        <label for="atk">공격력</label>
        <input type="number" id="atk" required><br>
        <label for="def">수비력</label>
        <input type="number" id="def" required><br>
        <label for="spd">스피드</label>
        <input type="number" id="spd" required><br>

        <button type="submit">생성</button>
    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>닉네임</th>
                <th>클래스</th>
                <th>레벨</th>
                <th>공격력</th>
                <th>수비력</th>
                <th>스피드</th>
                <th></th>
            </tr>
        </thead>

        <tbody id="characterList">
            
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<script>
    let index = 3;

    let characters = [
        {
            num: 1,
            nickname: "아르테미스",
            class: "궁수",
            level: 100,
            attack: 85,
            defense: 20,
            speed: 150
        },
        {
            num: 2,
            nickname: "카이저",
            class: "전사",
            level: 83,
            attack: 70,
            defense: 80,
            speed: 30
        },
        {
            num: 3,
            nickname: "스펠위버",
            class: "마법사",
            level: 140,
            attack: 120,
            defense: 20,
            speed: 60
        },
    ]
    
    function renderCharacters(){
        const characterList = document.querySelector("#characterList");

        characterList.innerHTML = "";

        characters.forEach(function(character){
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${character.num}</td>
                <td>${character.nickname}</td>
                <td>${character.class}</td>
                <td>${character.level}</td>
                <td>${character.attack}</td>
                <td>${character.defense}</td>
                <td>${character.speed}</td>
                <td>
                    <button>수정</button>
                    <button>삭제</button>
                </td>
            `;

            characterList.appendChild(row);
        })
    }

    document.getElementById("characterInfo").addEventListener("submit", function(event){
        event.preventDefault();

        const nickname = document.getElementById("nickname").value;
        const uClass = document.getElementById("uClass").value;
        const level = Number(document.getElementById("level").value);
        const atk = Number(document.getElementById("atk").value);
        const def = Number(document.getElementById("def").value);
        const spd = Number(document.getElementById("spd").value);

        if(nickname.length < 2 || nickname.length > 10){
            alert("닉네임은 2~10글자 사이로 입력해주세요.");
            return;
        }

        if(uClass===""){
            alert("클래스를 선택하세요.");
            return;
        }

        if(level < 1 || level > 200){
            alert("레벨은 1~200 사이로 입력해주세요.");
            return;
        }

        if(atk < 0){
            alert("공격력은 0 이상이어야 합니다.");
            return;
        }

        if(def < 0){
            alert("수비력은 0 이상이어야 합니다.");
            return;
        }

        if(spd < 0){
            alert("스피드는 0 이상이어야 합니다.");
            return;
        }

        characters.push({
            num: ++index,
            nickname: nickname,
            class: uClass,
            level: level,
            attack: atk,
            defense: def,
            speed: spd
        }); 

        renderCharacters();
    })

    renderCharacters();
</script>
